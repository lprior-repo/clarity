[package]
name = "br_show"
version = "0.1.0"
edition = "2021"
authors = ["Claude Code"]
description = "Command-line interface for showing bead details from the br command"
license = "MIT"
repository = "https://github.com/yourusername/clarity"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "br_show"
path = "br_show.rs"