<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarity Application</title>
    <!-- Tailwind CSS + daisyUI via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styles -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/assets/responsive.css">
    <link rel="modulepreload" href="/assets/dioxus/clarity-client.js">
    <link rel="modulepreload" href="/assets/dioxus/dioxus.js">
    <style>
        /* Custom scrollbar for task editor */
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: var(--color-surface); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--color-text-secondary); border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: var(--color-text-primary); }
    </style>
</head>
<body>
    <div id="main"></div>
    <script type="module">
        import init from "/assets/dioxus/clarity-client.js";

        async function main() {
            await init("/assets/dioxus/clarity-client_bg.wasm");
        }

        main();
    </script>
</body>
</html>
