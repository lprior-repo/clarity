[package]
name = "clarity-client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clarity-client"
path = "src/main.rs"

[[bin]]
name = "br_show"
path = "src/bin/br_show.rs"

[[bin]]
name = "br_show_bd_2zk"
path = "src/bin/br_show_bd_2zk.rs"

[dependencies]
clarity-core = { path = "../clarity-core" }
dioxus = { version = "0.7.3", features = ["desktop"] }
dioxus-desktop = "0.7.3"
dioxus-router = "0.5.0"
web-sys = { version = "0.3", features = ["Window", "HtmlTextAreaElement", "Navigator", "Clipboard"] }
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
chrono.workspace = true
anyhow.workspace = true
itertools.workspace = true
thiserror.workspace = true
tap.workspace = true
rpds.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dirs.workspace = true
uuid.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
rfd = "0.15"
tempfile = "3.12"
clap = { version = "4.0", features = ["derive"] }