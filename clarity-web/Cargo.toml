[package]
name = "clarity-web"
version.workspace = true
edition.workspace = true
autoexamples = false

[dependencies]
# Dioxus 0.7 - fullstack with web and server
dioxus = { version = "0.7.3", features = ["router"] }
dioxus-logger = "0.5"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = "6"
itertools = { workspace = true }
regex = "1"
toml = "0.8"
once_cell = { workspace = true }
tap = { workspace = true }
uuid = { workspace = true, features = ["js"] }
tracing = { workspace = true }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Server-only dependencies (not for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
dioxus-fullstack = { version = "0.7.3" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
serial_test = "3"
futures-util = { workspace = true }

[[test]]
name = "e2e_discover_guided"
path = "tests/e2e/discover_guided.rs"

[[test]]
name = "server_functions_test"
path = "tests/server_functions_test.rs"

[[test]]
name = "queue_adversarial"
path = "tests/queue_adversarial.rs"

[[test]]
name = "empty_json_payload"
path = "tests/empty_json_payload.rs"

[features]
default = ["fullstack"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server"]
fullstack = ["dioxus/fullstack"]

[[bin]]
name = "clarity-web"
path = "src/main.rs"
