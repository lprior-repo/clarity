$schema: "https://moonrepo.dev/schemas/tasks.json"
tasks:
  build:
    command: "cargo build --release"
    description: "Build intent CLI binary"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
    options:
      cache: true

  check:
    command: "cargo check"
    description: "Type check intent CLI"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
    options:
      cache: true

  test:
    command: "cargo test"
    description: "Run intent CLI tests"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
    options:
      cache: true

  clippy:
    command: "cargo clippy -- -D warnings"
    description: "Lint intent CLI with clippy"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
    options:
      cache: true

  ci:
    command: "cargo check && cargo clippy -- -D warnings && cargo test"
    description: "Run CI checks for intent CLI"
    options:
      cache: true
